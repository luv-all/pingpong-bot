# 이 Mac의 Homebrew OpenCV 4 + LLVM 경로. Git에 포함하지 않아
# Windows 실기 빌드에는 영향을 주지 않는다.
[env]
LIBCLANG_PATH = { value = "/opt/homebrew/opt/llvm/lib", force = false }
PKG_CONFIG_PATH = { value = "/opt/homebrew/opt/opencv@4/lib/pkgconfig", force = false }
DYLD_FALLBACK_LIBRARY_PATH = { value = "/opt/homebrew/opt/llvm/lib:/opt/homebrew/opt/opencv@4/lib", force = false }

# opencv crate의 build-script 실행 파일 자체가 @rpath/libclang.dylib에
# 링크되므로, macOS loader가 찾을 수 있게 rpath를 직접 넣는다.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,/opt/homebrew/opt/llvm/lib",
    "-C", "link-arg=-Wl,-rpath,/opt/homebrew/opt/opencv@4/lib",
]
