[package]
name = "rl-tune"
edition.workspace = true
version.workspace = true

[[bin]]
name = "rl_tune"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
pingpong-bot = { path = "../..", default-features = false }
rand = "0.8"
rapier3d = "0.34.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
