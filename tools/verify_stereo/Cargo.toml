[package]
name = "verify-stereo"
edition.workspace = true
version.workspace = true

[[bin]]
name = "verify_stereo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
opencv = { version = "0.98.2", default-features = false, features = [
    "highgui",
    "imgproc",
    "videoio",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pingpong-bot = { path = "../..", default-features = false, features = ["gui"] }
